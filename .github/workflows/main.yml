name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Waiting Update ZIP
        run: |
          echo "ZIP files found:"
          find . -maxdepth 1 -type f -iname "*.zip" -print

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*waiting*update*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Waiting update ZIP was not found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Waiting Update
        run: |
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          echo "Project contents:"
          ls -lah project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Debug Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore project/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        run: |
          cd project
          gradle clean assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "APK files:"
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TuktukMeter-GPS-Waiting-Update
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
