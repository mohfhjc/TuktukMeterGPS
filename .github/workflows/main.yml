name: Build PC Game Emulator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Extract PC Game Emulator
        run: |
          mkdir -p pcgame
          unzip -o "PCGameEmulator-Mobile-v1.zip" -d pcgame

      - name: Check Project
        run: |
          echo "PC Game Emulator files:"
          find pcgame -maxdepth 3 -type f | sort

      - name: Build APK
        working-directory: pcgame
        run: |
          gradle clean
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "APK files:"
          find pcgame -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PCGameEmulator-debug
          path: pcgame/app/build/outputs/apk/debug/app-debug.apk
