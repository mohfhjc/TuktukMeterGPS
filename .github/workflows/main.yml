name: Build PC Game Emulator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Extract PC Game Emulator
        run: |
          mkdir -p pcgame
          unzip -o "PCGameEmulator-Mobile-v1.zip" -d pcgame

      - name: Fix Java and Kotlin JVM Target
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("pcgame/app/build.gradle")
          text = p.read_text()

          if "compileOptions" not in text:
              text = text.replace(
                  "    defaultConfig {",
                  """    compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              defaultConfig {"""
              )

          p.write_text(text)
          print(p.read_text())
          PY

      - name: Build APK
        working-directory: pcgame
        run: |
          gradle clean
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          find pcgame -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PCGameEmulator-debug
          path: pcgame/app/build/outputs/apk/debug/app-debug.apk
