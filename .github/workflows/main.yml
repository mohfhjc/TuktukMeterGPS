name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "Using ZIP file: $ZIP_FILE"

          mkdir project
          unzip -q "$ZIP_FILE" -d project

      - name: Detect project folder
        run: |
          if [ -f "project/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          elif [ -f "project/*/settings.gradle.kts" ]; then
            PROJECT_DIR=$(find project -maxdepth 2 -name "settings.gradle.kts" -print -quit | xargs dirname)
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          else
            SETTINGS=$(find project -maxdepth 3 -name "settings.gradle.kts" -print -quit)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: Android project not found."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

          echo "Project directory: $PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$PROJECT_DIR/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "APK files:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TuktukMeter-GPS-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
