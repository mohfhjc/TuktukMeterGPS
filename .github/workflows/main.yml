name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          echo "Files in repository:"
          ls -lah

          ZIP_FILE=""

          # ابحث أولاً عن نسخة تحديث الانتظار
          if [ -f "tuktuk-meter-GPS-waiting-update.zip" ]; then
            ZIP_FILE="tuktuk-meter-GPS-waiting-update.zip"

          # ثم النسخة المعدلة السابقة
          elif [ -f "tuktuk2-meter-GPS-build-ready.zip" ]; then
            ZIP_FILE="tuktuk2-meter-GPS-build-ready.zip"

          # ثم النسخة الأصلية
          elif [ -f "tuktuk-meter-GPS-fixed.zip" ]; then
            ZIP_FILE="tuktuk-meter-GPS-fixed.zip"

          else
            echo "ERROR: No project ZIP file found!"
            echo "Available ZIP files:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Using project: $ZIP_FILE"

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          echo "Project files:"
          ls -lah project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore project/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        run: |
          cd project
          gradle clean assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "APK files:"
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TuktukMeter-GPS-Waiting-Update
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
