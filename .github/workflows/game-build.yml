name: Setup Game and Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "TukTukEscape-first-version.zip"

permissions:
  contents: write

jobs:
  setup-and-build:

    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.6.3

    steps:

      # ==========================================
      # 1 - تحميل المستودع
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # ==========================================
      # 2 - تثبيت الأدوات
      # ==========================================
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y unzip git

      # ==========================================
      # 3 - إصلاح صلاحيات Git
      # ==========================================
      - name: Fix Git Safe Directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # ==========================================
      # 4 - تجهيز Android SDK + Java + Templates
      # ==========================================
      - name: Setup Godot Android
        run: |

          echo "Setting up Godot Android environment..."

          mkdir -p ~/.config
          mkdir -p ~/.local/share/godot/export_templates

          # نقل إعدادات Godot الموجودة في صورة Docker
          if [ -d "/root/.config/godot" ]; then
            cp -r /root/.config/godot ~/.config/
          fi

          # نقل Android export templates
          if [ -d "/root/.local/share/godot/export_templates/4.6.3.stable" ]; then

            rm -rf ~/.local/share/godot/export_templates/4.6.3.stable

            cp -r \
              /root/.local/share/godot/export_templates/4.6.3.stable \
              ~/.local/share/godot/export_templates/

          fi

          # إنشاء إعدادات Java
          mkdir -p ~/.config/godot

          cat > ~/.config/godot/editor_settings-4.6.tres <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          EOF

          echo "Godot Android environment ready."

          echo "Checking Java:"
          java -version || true

          echo "Checking Android templates:"
          find ~/.local/share/godot/export_templates -maxdepth 2 -type f | head -30

      # ==========================================
      # 5 - فك ملف اللعبة
      # ==========================================
      - name: Extract Game ZIP
        run: |

          echo "Extracting TukTuk Escape..."

          if [ ! -f "TukTukEscape-first-version.zip" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          rm -rf game/TukTukEscape
          rm -rf /tmp/tuktuk_game

          mkdir -p game
          mkdir -p /tmp/tuktuk_game

          unzip -o \
            "TukTukEscape-first-version.zip" \
            -d /tmp/tuktuk_game

          echo "ZIP contents:"
          find /tmp/tuktuk_game -maxdepth 5 -type f

          if [ -d "/tmp/tuktuk_game/game/TukTukEscape" ]; then

            cp -r \
              /tmp/tuktuk_game/game/TukTukEscape \
              game/

          elif [ -d "/tmp/tuktuk_game/TukTukEscape" ]; then

            cp -r \
              /tmp/tuktuk_game/TukTukEscape \
              game/

          else

            echo "ERROR: TukTukEscape folder not found!"
            exit 1

          fi

          echo "Game extracted successfully."

      # ==========================================
      # 6 - التأكد من ملفات اللعبة
      # ==========================================
      - name: Check Game Files
        run: |

          echo "Checking Godot project..."

          test -f game/TukTukEscape/project.godot
          test -f game/TukTukEscape/Main.tscn
          test -f game/TukTukEscape/scripts/main.gd

          echo "Game project found."

          find game/TukTukEscape -maxdepth 3 -type f

      # ==========================================
      # 7 - إنشاء Android Export Preset كامل
      # ==========================================
      - name: Create Android Export Preset
        run: |

          cat > game/TukTukEscape/export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"

          platform="Android"

          runnable=true

          dedicated_server=false

          custom_features=""

          export_filter="all_resources"

          include_filter=""

          exclude_filter=""

          export_path=""

          encryption_include_filters=""

          encryption_exclude_filters=""

          encrypt_pck=false

          encrypt_directory=false

          script_export_mode=2


          [preset.0.options]

          custom_template/debug=""

          custom_template/release=""

          gradle_build/use_gradle_build=false

          gradle_build/export_format=0

          gradle_build/min_sdk=""

          gradle_build/target_sdk=""

          architectures/armeabi-v7a=false

          architectures/arm64-v8a=true

          architectures/x86=false

          architectures/x86_64=false

          version/code=1

          version/name="1.0"

          package/unique_name="com.mohfjc.tuktukescape"

          package/name="TukTuk Escape"

          package/signed=true

          package/app_category=2

          package/retain_data_on_uninstall=false

          package/exclude_from_recents=false

          package/show_in_android_tv=false

          package/show_as_launcher_app=false

          package/show_in_app_library=true

          launcher_icons/main_192x192=""

          launcher_icons/adaptive_foreground_432x432=""

          launcher_icons/adaptive_background_432x432=""

          graphics/opengl_debug=false

          xr_features/xr_mode=0

          screen/immersive_mode=true

          screen/support_small=true

          screen/support_normal=true

          screen/support_large=true

          screen/support_xlarge=true

          user_data_backup/allow=false

          command_line/extra_args=""

          apk_expansion/enable=false

          permissions/custom_permissions=PackedStringArray()

          permissions/access_checkin_properties=false

          permissions/access_coarse_location=false

          permissions/access_fine_location=false

          permissions/access_network_state=false

          permissions/access_notification_policy=false

          permissions/access_wifi_state=false

          permissions/add_always_on_display_description=false

          permissions/add_instant_app=false

          permissions/access_media_location=false

          permissions/access_mock_location=false

          permissions/access_mtp=false

          permissions/access_overlay=false

          permissions/access_phone_state=false

          permissions/access_background_location=false

          permissions/access_location_extra_commands=false

          permissions/access_fine_location=false

          permissions/access_coarse_location=false
          EOF

          echo "Android export preset created."

          echo "===== EXPORT PRESET ====="

          cat game/TukTukEscape/export_presets.cfg

      # ==========================================
      # 8 - فحص Godot
      # ==========================================
      - name: Check Godot
        run: |

          godot --version

          cd game/TukTukEscape

          godot \
            --headless \
            --editor \
            --quit

          echo "Godot project check completed."

      # ==========================================
      # 9 - حفظ ملفات اللعبة في GitHub
      # ==========================================
      - name: Save Game Files
        run: |

          git config --global user.name "github-actions[bot]"

          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git add game/TukTukEscape

          if git diff --cached --quiet; then

            echo "No new files to commit."

          else

            git commit \
              -m "Add TukTuk Escape game automatically"

            git push

          fi

      # ==========================================
      # 10 - تجهيز مجلد APK
      # ==========================================
      - name: Prepare APK Folder
        run: |

          mkdir -p build/android

      # ==========================================
      # 11 - بناء APK
      # ==========================================
      - name: Build Android APK
        run: |

          cd game/TukTukEscape

          echo "Starting Android APK build..."

          godot \
            --headless \
            --verbose \
            --export-debug \
            "Android" \
            "../../build/android/TukTukEscape-debug.apk"

      # ==========================================
      # 12 - فحص APK
      # ==========================================
      - name: Check APK
        run: |

          echo "Searching for APK..."

          find build \
            -type f \
            -name "*.apk" \
            -print

          if [ ! -f "build/android/TukTukEscape-debug.apk" ]; then

            echo "ERROR: APK was not created!"

            exit 1

          fi

          echo "================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "================================"

          ls -lh \
            build/android/TukTukEscape-debug.apk

      # ==========================================
      # 13 - رفع APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TukTukEscape-APK
          path: build/android/TukTukEscape-debug.apk
          retention-days: 14
