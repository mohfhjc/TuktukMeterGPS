name: Setup Game + Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "TukTukEscape-first-version.zip"

permissions:
  contents: write

jobs:
  setup-and-build:

    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.6.3

    steps:

      # =========================
      # 1 - تحميل المستودع
      # =========================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # =========================
      # 2 - تثبيت أدوات فك الضغط
      # =========================
      - name: Install unzip
        run: |
          apt-get update
          apt-get install -y unzip git

      # =========================
      # 3 - فك ZIP تلقائياً
      # =========================
      - name: Extract Game ZIP
        run: |
          echo "Extracting game..."

          if [ ! -f "TukTukEscape-first-version.zip" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          rm -rf game/TukTukEscape

          mkdir -p game

          unzip -o "TukTukEscape-first-version.zip" -d /tmp/tuktuk_game

          if [ -d "/tmp/tuktuk_game/game/TukTukEscape" ]; then
            cp -r /tmp/tuktuk_game/game/TukTukEscape game/
          elif [ -d "/tmp/tuktuk_game/TukTukEscape" ]; then
            cp -r /tmp/tuktuk_game/TukTukEscape game/
          else
            echo "ERROR: TukTukEscape folder was not found"
            find /tmp/tuktuk_game -maxdepth 4 -type f
            exit 1
          fi

          echo "Game extracted successfully."

      # =========================
      # 4 - فحص المشروع
      # =========================
      - name: Check Godot Project
        run: |

          if [ ! -f "game/TukTukEscape/project.godot" ]; then
            echo "ERROR: project.godot not found"
            find game -maxdepth 5 -type f
            exit 1
          fi

          if [ ! -f "game/TukTukEscape/Main.tscn" ]; then
            echo "ERROR: Main.tscn not found"
            exit 1
          fi

          if [ ! -f "game/TukTukEscape/scripts/main.gd" ]; then
            echo "ERROR: main.gd not found"
            exit 1
          fi

          echo "Godot project OK."

      # =========================
      # 5 - إعداد Godot Android
      # =========================
      - name: Setup Godot Android
        run: |

          mkdir -p ~/.config/godot

          if [ -f "/root/.config/godot/editor_settings-4.6.tres" ]; then
            cp /root/.config/godot/editor_settings-4.6.tres \
              ~/.config/godot/editor_settings-4.6.tres
          fi

          echo "Android environment ready."

      # =========================
      # 6 - إنشاء Export Preset
      # =========================
      - name: Create Android Export Preset
        run: |

          cat > game/TukTukEscape/export_presets.cfg <<'EOF'

          [preset.0]

          name="Android"
          platform="Android"
          runnable=true

          [preset.0.options]

          package/unique_name="com.mohfjc.tuktukescape"
          package/name="TukTuk Escape"

          version/code=1
          version/name="1.0"

          screen/orientation=1

          architecture/arm64-v8a=true
          architecture/armeabi-v7a=false
          architecture/x86_64=false

          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false

          EOF

          echo "Export preset created."

      # =========================
      # 7 - فحص Godot
      # =========================
      - name: Check Godot
        run: |

          godot --version

          cd game/TukTukEscape

          godot \
            --headless \
            --path . \
            --editor \
            --quit

      # =========================
      # 8 - حفظ اللعبة في GitHub
      # =========================
      - name: Save Game Files
        run: |

          git config --global user.name "github-actions[bot]"

          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add game/TukTukEscape

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add TukTuk Escape game"
            git push
          fi

      # =========================
      # 9 - بناء APK
      # =========================
      - name: Build Android APK
        run: |

          mkdir -p build/android

          cd game/TukTukEscape

          godot \
            --headless \
            --verbose \
            --export-debug \
            "Android" \
            "../../build/android/TukTukEscape-debug.apk"

      # =========================
      # 10 - التأكد من APK
      # =========================
      - name: Check APK
        run: |

          echo "Searching for APK..."

          find build -type f -name "*.apk" -print

          if ! find build -type f -name "*.apk" | grep -q ".apk"; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK successfully created."

      # =========================
      # 11 - رفع APK
      # =========================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TukTukEscape-APK
          path: build/android/TukTukEscape-debug.apk
          retention-days: 14
