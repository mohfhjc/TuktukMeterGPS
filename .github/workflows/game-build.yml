name: Setup Game and Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "TukTukEscape-first-version.zip"

permissions:
  contents: write

jobs:
  setup-and-build:

    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.6.3

    steps:

      # ==============================
      # Checkout
      # ==============================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # ==============================
      # Git permissions
      # ==============================
      - name: Configure Git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ==============================
      # Extract ZIP
      # ==============================
      - name: Extract Game ZIP
        run: |

          echo "Extracting game..."

          rm -rf /tmp/tuktuk_game
          rm -rf game/TukTukEscape

          mkdir -p /tmp/tuktuk_game
          mkdir -p game

          unzip -o \
            "TukTukEscape-first-version.zip" \
            -d /tmp/tuktuk_game

          echo "ZIP files:"
          find /tmp/tuktuk_game -maxdepth 5 -type f

          if [ -d "/tmp/tuktuk_game/game/TukTukEscape" ]; then

            cp -r \
              /tmp/tuktuk_game/game/TukTukEscape \
              game/

          elif [ -d "/tmp/tuktuk_game/TukTukEscape" ]; then

            cp -r \
              /tmp/tuktuk_game/TukTukEscape \
              game/

          else

            echo "ERROR: Game folder not found!"
            exit 1

          fi

      # ==============================
      # Check project
      # ==============================
      - name: Check Project
        run: |

          test -f game/TukTukEscape/project.godot
          test -f game/TukTukEscape/Main.tscn
          test -f game/TukTukEscape/scripts/main.gd

          echo "Godot project OK."

      # ==============================
      # Configure Android
      # ==============================
      - name: Configure Android
        run: |

          echo "Java:"
          java -version

          echo "Godot:"
          godot --version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Build tools:"
          sdkmanager --list | grep "build-tools" | head -10 || true

          echo "Installed templates:"
          find ~/.local/share/godot/export_templates \
            -maxdepth 2 \
            -type f \
            | head -30

      # ==============================
      # Create proper Godot export preset
      # ==============================
      - name: Create Export Preset
        run: |

          cat > game/TukTukEscape/export_presets.cfg <<'EOF'
          [preset.0]

          name="Android Debug"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          version/code=1
          version/name="1.0"

          package/unique_name="com.mohfjc.tuktukescape"
          package/name="TukTuk Escape"

          package/signed=true

          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false

          screen/immersive_mode=true
          screen/orientation=1

          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""

          graphics/opengl_debug=false

          xr_features/xr_mode=0

          user_data_backup/allow=false

          command_line/extra_args=""

          apk_expansion/enable=false

          permissions/custom_permissions=PackedStringArray()

          permissions/access_checkin_properties=false
          permissions/access_coarse_location=false
          permissions/access_fine_location=false
          permissions/access_network_state=true
          permissions/access_notification_policy=false
          permissions/access_wifi_state=true
          permissions/add_always_on_display_description=false
          permissions/add_instant_app=false
          permissions/access_media_location=false
          permissions/access_mock_location=false
          permissions/access_mtp=false
          permissions/access_overlay=false
          permissions/access_phone_state=false
          permissions/access_background_location=false
          permissions/access_location_extra_commands=false
          EOF

          echo "Export preset:"
          cat game/TukTukEscape/export_presets.cfg

      # ==============================
      # Validate Godot project
      # ==============================
      - name: Validate Godot Project
        run: |

          cd game/TukTukEscape

          godot \
            --headless \
            --editor \
            --quit

      # ==============================
      # Save project to GitHub
      # ==============================
      - name: Save Game
        run: |

          git add game/TukTukEscape

          if git diff --cached --quiet; then

            echo "Nothing to commit."

          else

            git commit \
              -m "Add TukTuk Escape game project"

            git push

          fi

      # ==============================
      # Build APK
      # ==============================
      - name: Build Android APK
        run: |

          mkdir -p build/android

          cd game/TukTukEscape

          godot \
            --headless \
            --verbose \
            --export-debug \
            "Android Debug" \
            "../../build/android/TukTukEscape-debug.apk"

      # ==============================
      # Check APK
      # ==============================
      - name: Check APK
        run: |

          echo "Searching APK..."

          find build \
            -type f \
            -name "*.apk" \
            -print

          test -f \
            build/android/TukTukEscape-debug.apk

          echo "APK CREATED SUCCESSFULLY!"

          ls -lh \
            build/android/TukTukEscape-debug.apk

      # ==============================
      # Upload APK
      # ==============================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TukTukEscape-APK
          path: build/android/TukTukEscape-debug.apk
          retention-days: 14
