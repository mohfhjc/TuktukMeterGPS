name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "TukTukEscape-first-version.zip"
      - ".github/workflows/game-build.yml"
      - "game/**"

jobs:
  setup-and-build:
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.6.3

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Godot Android
        shell: bash
        run: |
          set -e

          echo "=== Set HOME ==="
          export HOME=/root
          echo "HOME=$HOME"

          echo "=== Prepare Godot config ==="
          mkdir -p /root/.config/godot
          mkdir -p /root/.local/share/godot/export_templates

          echo "=== Install export templates ==="

          if [ -d "/root/.local/share/godot/templates/4.6.3.stable" ]; then
            rm -rf "/root/.local/share/godot/export_templates/4.6.3.stable"
            mv "/root/.local/share/godot/templates/4.6.3.stable" \
               "/root/.local/share/godot/export_templates/4.6.3.stable"
          fi

          echo "=== Configure Android SDK ==="

          SETTINGS="/root/.config/godot/editor_settings-4.6.tres"

          touch "$SETTINGS"

          sed -i '/export\/android\/java_sdk_path/d' "$SETTINGS" || true
          sed -i '/export\/android\/android_sdk_path/d' "$SETTINGS" || true
          sed -i '/export\/android\/debug_keystore/d' "$SETTINGS" || true
          sed -i '/export\/android\/debug_keystore_user/d' "$SETTINGS" || true
          sed -i '/export\/android\/debug_keystore_pass/d' "$SETTINGS" || true

          cat >> "$SETTINGS" <<'EOF'
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          echo "=== Java ==="
          java -version

          echo "=== Android SDK ==="
          ls -la /usr/lib/android-sdk

          echo "=== Export templates ==="
          ls -la /root/.local/share/godot/export_templates/ || true

      - name: Extract Game
        shell: bash
        run: |
          set -e

          mkdir -p game/TukTukEscape

          if [ -f "TukTukEscape-first-version.zip" ]; then
            echo "Extracting game ZIP..."

            rm -rf /tmp/tuktuk
            mkdir -p /tmp/tuktuk

            unzip -o "TukTukEscape-first-version.zip" -d /tmp/tuktuk

            if [ -d "/tmp/tuktuk/game/TukTukEscape" ]; then
              cp -rf /tmp/tuktuk/game/TukTukEscape/. game/TukTukEscape/
            elif [ -d "/tmp/tuktuk/TukTukEscape" ]; then
              cp -rf /tmp/tuktuk/TukTukEscape/. game/TukTukEscape/
            fi
          fi

          echo "=== Game files ==="
          find game/TukTukEscape -maxdepth 3 -type f | sort

      - name: Configure Export Preset
        shell: bash
        run: |
          set -e

          cd game/TukTukEscape

          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android Debug"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          gradle_build/min_sdk="24"
          gradle_build/target_sdk="33"

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          version/code=1
          version/name="1.0"

          package/unique_name="com.mohfjc.tuktukescape"
          package/name="TukTuk Escape"
          package/signed=true

          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_android_tv=false
          package/show_as_launcher_app=true
          package/show_in_app_library=true

          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""

          graphics/opengl_debug=false

          xr_features/xr_mode=0

          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true

          user_data_backup/allow=false

          command_line/extra_args=""

          apk_expansion/enable=false

          permissions/custom_permissions=PackedStringArray()

          keystore/debug="/root/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"

          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""

          one_click_deploy/clear_previous_install=false
          EOF

          echo "=== Export preset ==="
          cat export_presets.cfg

      - name: Validate Godot
        shell: bash
        run: |
          set -e

          export HOME=/root

          cd game/TukTukEscape

          godot --headless --path . --editor --quit

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          export HOME=/root

          cd game/TukTukEscape

          mkdir -p ../../build/android

          echo "=== Starting Android export ==="

          godot \
            --headless \
            --verbose \
            --path . \
            --export-debug \
            "Android Debug" \
            "../../build/android/TukTukEscape-debug.apk"

          echo "=== APK created ==="
          ls -lh ../../build/android/

      - name: Check APK
        shell: bash
        run: |
          set -e

          if [ ! -f "build/android/TukTukEscape-debug.apk" ]; then
            echo "APK was not created!"
            exit 1
          fi

          ls -lh build/android/TukTukEscape-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TukTukEscape-Android
          path: build/android/TukTukEscape-debug.apk
