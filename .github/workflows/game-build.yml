name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "TukTukEscape-first-version.zip"
      - ".github/workflows/game-build.yml"
      - "game/**"

jobs:
  setup-and-build:

    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.6.3

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot Android
        shell: bash
        run: |
          set -e

          echo "=== Setup Godot ==="

          mkdir -p ~/.config
          mkdir -p ~/.local/share/godot/export_templates

          rm -rf ~/.config/godot
          cp -a /root/.config/godot ~/.config/godot

          rm -rf ~/.local/share/godot/export_templates/4.6.3.stable
          cp -a /root/.local/share/godot/export_templates/4.6.3.stable \
            ~/.local/share/godot/export_templates/4.6.3.stable

          echo "=== Java ==="
          java -version

          echo "=== Android SDK ==="
          ls -la /usr/lib/android-sdk

          echo "=== Templates ==="
          ls -la ~/.local/share/godot/export_templates/4.6.3.stable

      - name: Extract Game
        shell: bash
        run: |
          set -e

          rm -rf game/TukTukEscape
          mkdir -p game/TukTukEscape

          if [ ! -f "TukTukEscape-first-version.zip" ]; then
            echo "ERROR: TukTukEscape-first-version.zip not found."
            exit 1
          fi

          rm -rf /tmp/tuktuk
          mkdir -p /tmp/tuktuk

          unzip -o "TukTukEscape-first-version.zip" -d /tmp/tuktuk

          if [ -d "/tmp/tuktuk/game/TukTukEscape" ]; then
            cp -a /tmp/tuktuk/game/TukTukEscape/. game/TukTukEscape/
          elif [ -d "/tmp/tuktuk/TukTukEscape" ]; then
            cp -a /tmp/tuktuk/TukTukEscape/. game/TukTukEscape/
          else
            echo "ERROR: TukTukEscape folder not found in ZIP."
            find /tmp/tuktuk -maxdepth 4 -type f
            exit 1
          fi

          echo "=== Game ==="
          find game/TukTukEscape -maxdepth 3 -type f | sort

      - name: Create Android Export Preset
        shell: bash
        run: |
          set -e

          cd game/TukTukEscape

          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android Debug"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=true
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          gradle_build/compress_native_libraries=false
          gradle_build/export_format=0
          gradle_build/min_sdk="24"
          gradle_build/target_sdk="33"
          gradle_build/custom_theme_attributes={}

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          version/code=1
          version/name="1.0"

          package/unique_name="com.mohfjc.tuktukescape"
          package/name="TukTuk Escape"
          package/signed=true

          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_android_tv=false
          package/show_in_app_library=true
          package/show_as_launcher_app=true

          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""
          launcher_icons/adaptive_monochrome_432x432=""

          graphics/opengl_debug=false

          xr_features/xr_mode=0

          screen/immersive_mode=true
          screen/edge_to_edge=false
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true

          user_data_backup/allow=false

          command_line/extra_args=""

          apk_expansion/enable=false
          apk_expansion/SALT=""
          apk_expansion/public_key=""

          permissions/custom_permissions=PackedStringArray()

          keystore/debug="/root/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"

          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""

          one_click_deploy/clear_previous_install=false
          EOF

          echo "=== Export preset ==="
          cat export_presets.cfg

      - name: Validate Project
        shell: bash
        run: |
          set -e

          cd game/TukTukEscape

          godot \
            --headless \
            --path . \
            --editor \
            --quit

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          cd game/TukTukEscape

          mkdir -p ../../build/android

          echo "=== BUILDING APK ==="

          godot \
            --headless \
            --verbose \
            --path . \
            --export-debug \
            "Android Debug" \
            "../../build/android/TukTukEscape-debug.apk"

          echo "=== BUILD COMPLETE ==="

          ls -lh ../../build/android/

      - name: Check APK
        shell: bash
        run: |
          set -e

          if [ ! -f "build/android/TukTukEscape-debug.apk" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK SUCCESS:"
          ls -lh build/android/TukTukEscape-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TukTukEscape-Android
          path: build/android/TukTukEscape-debug.apk
